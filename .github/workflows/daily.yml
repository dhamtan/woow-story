name: Daily Web Stories

on:
  schedule:
    - cron: '0 2 * * *'   # 2 AM UTC
    - cron: '0 14 * * *'  # 2 PM UTC
  workflow_dispatch:      # Manual run button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Isse baar-baar install hone ki speed badhegi

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install google-generativeai requests

      - name: Run Story Generator
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          MY_URL: ${{ secrets.MY_URL }}
        run: python generator.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update stories: ${{ github.event.repository.updated_at }}"
          file_pattern: "*.html"
